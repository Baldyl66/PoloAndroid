name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Modèle vocal français pour le réveil « Polo » (Vosk, hors ligne)
        run: |
          curl -fsSL -o vosk.zip https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip
          unzip -q vosk.zip
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/vosk-fr
          mv vosk-model-small-fr-0.22 app/src/main/assets/vosk-fr

      - name: Voix naturelles françaises intégrées (Piper / sherpa-onnx, hors ligne)
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/sherpa-onnx-1.13.8.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          D=app/src/main/assets/tts-fr
          rm -rf $D && mkdir -p $D/femme $D/homme
          # voix choisies après mesure sur téléphone : siwis (féminine) et miro « high » (masculine,
          # plus naturelle et 2× plus rapide que tom)
          for pair in femme:siwis-medium homme:miro-high; do
            g=${pair%%:*}; n=${pair##*:}
            curl -fsSL https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-fr_FR-$n.tar.bz2 | tar xj
            m=vits-piper-fr_FR-$n
            mv $m/*.onnx $D/$g/model.onnx
            mv $m/tokens.txt $D/$g/tokens.txt
            [ -d $D/espeak-ng-data ] || mv $m/espeak-ng-data $D/espeak-ng-data
            rm -rf $m
          done
          du -sh $D

      - name: Clé de signature (secret GitHub)
        env:
          KS: ${{ secrets.POLO_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::warning::Secret POLO_KEYSTORE_B64 absent, APK signés avec une clé temporaire"; exit 0; fi
          # espaces / retours à la ligne ajoutés au copier-coller ignorés
          CLEAN=$(printf '%s' "$KS" | tr -d '[:space:]')
          echo "Secret : ${#CLEAN} caractères (attendu : environ 3440)"
          if ! printf '%s' "$CLEAN" | base64 -d > polo.keystore 2>/dev/null || [ ! -s polo.keystore ]; then
            rm -f polo.keystore
            echo "::error::POLO_KEYSTORE_B64 n'est pas un base64 valide : recolle tout le contenu du fichier POLO_KEYSTORE_B64.txt"
            exit 1
          fi

      - name: Construire l'autoradio et le compagnon
        env:
          POLO_KEYSTORE_PASSWORD: ${{ secrets.POLO_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease :compagnon:assembleRelease --no-daemon

      - name: Renommer les APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk PoloRadio.apk
          cp compagnon/build/outputs/apk/release/compagnon-release.apk PoloCompagnon.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PoloRadio-apk
          path: PoloRadio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PoloCompagnon-apk
          path: PoloCompagnon.apk

      - name: Publier dans Releases (téléchargeable sans compte)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere
          name: Dernière version
          body: "Autoradio : PoloRadio.apk · Téléphone : PoloCompagnon.apk (commit ${{ github.sha }})"
          make_latest: true
          files: |
            PoloRadio.apk
            PoloCompagnon.apk
