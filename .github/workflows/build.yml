name: Construire l'APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Construire l'autoradio et le compagnon
        run: gradle :app:assembleRelease :compagnon:assembleRelease --no-daemon

      - name: Renommer les APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk PoloRadio.apk
          cp compagnon/build/outputs/apk/release/compagnon-release.apk PoloCompagnon.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PoloRadio-apk
          path: PoloRadio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PoloCompagnon-apk
          path: PoloCompagnon.apk
